<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Portfolio in progress">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#eae6de"/>
      <stop offset="1" stop-color="#d5cfc4"/>
    </linearGradient>
    <filter id="n" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <rect width="100%" height="100%" filter="url(#n)" opacity="0.18"/>
  <text x="50%" y="600" text-anchor="middle"
        font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="26.5" letter-spacing="5.54" fill="#8b8477">PORTFOLIO IN PROGRESS</text>
  <rect x="531" y="637" width="138" height="3" fill="#a8451c" opacity="0.55"/>
</svg>