<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-label="Portfolio in progress">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#eae6de"/>
      <stop offset="1" stop-color="#d5cfc4"/>
    </linearGradient>
    <filter id="n" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <rect width="100%" height="100%" filter="url(#n)" opacity="0.18"/>
  <text x="50%" y="625" text-anchor="middle"
        font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="22.1" letter-spacing="4.62" fill="#8b8477">PORTFOLIO IN PROGRESS</text>
  <rect x="442" y="656" width="115" height="2" fill="#a8451c" opacity="0.55"/>
</svg>